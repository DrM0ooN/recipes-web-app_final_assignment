{% extends "base.html" %}

{% block title %}Delete Comment{% endblock %}

{% block content %}
<div class="card" style="max-width: 720px; margin: 0 auto;">
    <h1>Delete Comment</h1>
    <p>Are you sure you want to delete this comment on <strong>{{ recipe.title }}</strong>?</p>
    <blockquote style="border-left: 4px solid var(--border); padding-left: 1rem; margin: 1rem 0; color: var(--muted);">
        {{ comment.text }}
    </blockquote>
    <form method="post">
        {% csrf_token %}
        <button type="submit">Yes, delete comment</button>
        <a class="secondary-link" href="{% url 'recipe_detail' recipe.pk %}">Cancel</a>
    </form>
</div>
{% endblock %}
